# The toolchain and the tasks CI and people call. Go is pinned to the patch:
# it compiles the release's binaries (scripts/build.sh), which the flake
# installs as they are, so CI and a laptop compile with the same compiler.
# Its major.minor is the one nixpkgs' go_1_27 has on nixos-26.05, which the
# flake's dev shell offers; the weekly update moves the patch, a new minor
# moves by hand with the nixpkgs attribute.
#
# The Zig of quoin-sudo's plugin (sudo/) is built and tested by the flake
# only: it compiles against sudo's and PAM's headers, which nixpkgs has and
# a runner does not.
[tools]
go = "1.27.4"
shellcheck = "0.11.0"

[env]
# Static binaries with no libc, as every release is (scripts/build.sh says
# why).
CGO_ENABLED = "0"

[tasks.check]
description = "Lint, unit tests, shellcheck and the release scripts' tests: the dev loop and CI's fast job"
depends = ["lint", "test", "shellcheck", "scripts-test"]

# lint and shellcheck are skipped while their sources stand still; test is
# not, since Go's own test cache knows better than a glob what a test read.
[tasks.lint]
description = "gofmt and go vet"
sources = ["**/*.go", "go.mod", "go.sum"]
outputs = { auto = true }
run = [
  'test -z "$(gofmt -l .)" || { gofmt -l . >&2; echo "not gofmt-ed" >&2; exit 1; }',
  "go vet ./...",
]

# The TPM and SSHSIG tests skip without swtpm and ssh-keygen, unless
# QUOIN_REQUIRE_SWTPM or QUOIN_REQUIRE_SSH_KEYGEN is set, as CI sets them.
[tasks.test]
description = "go test, every package"
run = "go test ./..."

# The race detector's runtime is C, so this is the one task that turns cgo
# on, for itself, and needs a C compiler (CI's race job has gcc; locally,
# `nix develop -c mise run race`). Nothing it builds ships: every release
# stays static.
[tasks.race]
description = "go test -race, every package (needs cgo and a C compiler)"
run = "CGO_ENABLED=1 go test -race ./..."

[tasks.shellcheck]
description = "shellcheck the scripts"
sources = ["scripts/*.sh"]
outputs = { auto = true }
run = "shellcheck scripts/*.sh"

[tasks.build]
description = "quoin's static binaries for linux amd64 and arm64, in dist/: the release's assets"
run = "scripts/build.sh"

# What counts as a release's input is listed, and argued, in the script; the
# last release is its tag's parent (scripts/last-release.sh).
[tasks.release-due]
description = "Exit 0, printing true, if anything a release is built from changed since the last release; else print false and exit 1"
run = "scripts/release-due.sh"

[tasks.scripts-test]
description = "The release scripts' own tests, against a throwaway repository and a known SHA256SUMS"
run = ["scripts/release-due-test.sh", "scripts/release-json-test.sh"]
