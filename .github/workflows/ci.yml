name: CI

on:
  push:
    branches: [trunk]
  pull_request:
  # A dispatch is checked as a push is, and released as a push is, if
  # anything a release is built from changed since the last release
  # (scripts/release-due.sh); `release` releases regardless. The weekly update dispatches it with `release` when
  # mise run release-due says so, its push having started nothing.
  workflow_dispatch:
    inputs:
      release:
        type: boolean
        default: false

# A run shell is bash -eo pipefail: a failure inside a pipe fails the step.
defaults:
  run:
    shell: bash

jobs:
  # Lint, the unit tests and the release scripts' tests through mise, the
  # dev loop's toolchain, which also compiles the release (scripts/build.sh).
  # swtpm from apt, and ssh-keygen, which the runner has, with the REQUIRE
  # variables set, so the TPM and SSHSIG tests fail rather than skip without
  # them.
  check:
    runs-on: ubuntu-latest
    env:
      QUOIN_REQUIRE_SWTPM: "1"
      QUOIN_REQUIRE_SSH_KEYGEN: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - name: swtpm, for the TPM tests
        run: sudo apt-get install -y --no-install-recommends swtpm
      # peer's tests make a user namespace to see a process in one told
      # apart from the host's. Ubuntu's runners let an unprivileged user
      # namespace be made and then refuse every capability in it (AppArmor),
      # and where that is so the tests skip rather than fail. Lifted here,
      # so they run.
      - name: Let unprivileged user namespaces hold capabilities
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: mise run check

  # The tests again, under the race detector. Its runtime is C, so this job
  # alone builds with cgo (mise run race turns it on for itself; the runner
  # has gcc); nothing it builds ships.
  race:
    runs-on: ubuntu-latest
    env:
      QUOIN_REQUIRE_SWTPM: "1"
      QUOIN_REQUIRE_SSH_KEYGEN: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - name: swtpm, for the TPM tests
        run: sudo apt-get install -y --no-install-recommends swtpm
      - name: Let unprivileged user namespaces hold capabilities
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: mise run race

  # The release's binaries, static, for linux amd64 and arm64
  # (scripts/build.sh), kept as the run's artifact whether or not the commit
  # is released: the nix job installs them through the flake for the VM
  # tests, and the release job publishes them.
  build:
    runs-on: ubuntu-latest
    steps:
      # The whole history, because the version's minor is the commit count;
      # scripts/version.sh refuses a shallow clone rather than stamp a wrong
      # version.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
      - run: mise run build
      - uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: dist/
          if-no-files-found: error

  # The checks spread over runners, each with its own four vCPUs: on one
  # runner the VM tests and the Zig check all shared four. Each check that
  # takes minutes is a leg of its own, named in SEPARATE; the rest leg builds
  # every other check, so a check added to the flake is built by the rest
  # leg until it is given one, and is never left out.
  #
  # The flake's Go packages are a release's binaries, not a build from
  # source (flake.nix says why): they exist only where nix/release.json
  # does, which on GitHub is a release tag's own commit. So each leg first
  # makes this checkout a release of the binaries this run's build job made,
  # scripts/nix-local-release.sh: it writes and stages nix/release.json for
  # them, as the release job will, and adds each binary to the store at the
  # path fetchurl would download it to, which is content-addressed, so only
  # the file whose hash release.json names can stand there and nothing is
  # fetched. The VM tests thus run the very binaries this run releases,
  # through the same release.json, fetchurl and install a pinned tag uses,
  # and no flake output exists only for CI.
  #
  # The Zig plugin is still built from source (flake.nix says why), so the
  # danielbodart cache is read here, and the rest leg pushes the plugin,
  # which every host builds, to it.
  nix:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        checks: [signer, sudo-gate, sudo-remote, policy, sudo-zig, rest]
    env:
      # The legs above but rest: kept in step with them, which the rest leg
      # holds by counting.
      SEPARATE: signer sudo-gate sudo-remote policy sudo-zig
    steps:
      # The whole history: scripts/version.sh counts it, to name the
      # binaries' version as the build job did.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            system-features = nixos-test benchmark big-parallel kvm

      # The danielbodart cache, read-only here: the free tier is 5 GB, so
      # only the plugin is pushed, by the last step, never a VM test's
      # closure.
      - uses: cachix/cachix-action@v17
        with:
          name: danielbodart
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true

      # nixos-test and kvm are declared for the VM tests: the signer over a
      # software TPM, the sudo gate, remote sudo and the courier. The standard
      # runner has KVM, and install-nix-action opens it to the build users,
      # but it has four vCPUs for every VM and build the check runs at once.

      - name: The flake as trunk has it, evaluated
        if: matrix.checks == 'rest'
        run: nix flake check --no-build --all-systems

      - uses: actions/download-artifact@v8
        with:
          name: binaries
          path: artifacts

      - name: This run's binaries as the flake's release
        run: |
          V="$(scripts/version.sh)"
          scripts/release-assets.sh "$V" release artifacts
          scripts/nix-local-release.sh "$V" release

      - name: Build ${{ matrix.checks }}
        env:
          LEG: ${{ matrix.checks }}
          LEGS: ${{ strategy.job-total }}
        run: |
          if [ "$LEG" = rest ]; then
            read -ra separate <<<"$SEPARATE"
            if [ "$LEGS" -ne $(( ${#separate[@]} + 1 )) ]; then
              echo "SEPARATE names ${#separate[@]} legs and the matrix has $LEGS with rest: keep them in step" >&2
              exit 1
            fi
            all=$(nix eval --json .#checks.x86_64-linux --apply builtins.attrNames | jq -r '.[]')
            for c in "${separate[@]}"; do
              grep -qxF "$c" <<<"$all" || { echo "SEPARATE names $c, which is no check" >&2; exit 1; }
            done
            mapfile -t checks < <(grep -vxF -f <(printf '%s\n' "${separate[@]}") <<<"$all")
            # And what nix flake check built besides the checks.
            extra=(.#packages.x86_64-linux.quoin .#packages.x86_64-linux.fakegalley .#packages.x86_64-linux.agenttamper
              .#devShells.x86_64-linux.default .#formatter.x86_64-linux)
          else
            checks=("$LEG")
            extra=()
          fi
          nix build --no-link --print-build-logs "${checks[@]/#/.#checks.x86_64-linux.}" "${extra[@]}"

      # The other systems the flake offers are evaluated, not built: no
      # runner here is any of them, and an evaluation error is what a change
      # to the flake most often breaks.
      - name: The other systems, evaluated
        if: matrix.checks == 'rest'
        run: scripts/nix-eval-systems.sh

      # The plugin a host builds, from the rest leg, which builds it. The Go
      # packages are the release's binaries, so there is nothing of them to
      # cache.
      - name: Push the plugin to Cachix
        if: matrix.checks == 'rest' && github.event_name != 'pull_request' && github.ref == 'refs/heads/trunk'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: nix build --no-link --print-out-paths .#quoin-sudo-plugin | cachix push danielbodart

  # CONTINUOUS RELEASE. Trunk-based: every push to trunk that passes the
  # checks above and changed what a release is built from since the last
  # one (scripts/release-due.sh) is published, with no manual step and no
  # tag to cut by hand. Gated on a push or a dispatch on trunk (never a pull
  # request), and on every job having succeeded, so a red commit never
  # ships. A release is the tag, its notes and the build job's binaries:
  # consumers take the flake (whose Go packages are those binaries), its
  # modules and the Go module from it.
  #
  #   tag      v<V>, V = scripts/version.sh (major.commit-count.run-number),
  #            on a commit of its own (below)
  #   binary   <binary>-<V>-linux-<arch>, arch in amd64/arm64 (Go's names),
  #            for quoin, quoin-signer, quoin-sudo, quoin-courier and the test
  #            tools fakegalley and agenttamper: the bare static executables
  #            the build job made (scripts/release-assets.sh)
  #   sums     SHA256SUMS, sha256sum(1) format, one line per binary
  #
  # THE TAG'S OWN COMMIT. flake.nix's Go packages are the release's
  # binaries, fetched, and a flake fetched as github:danielbodart/quoin/v<V>
  # sees its commit but not its tag, so the version and each asset's URL and
  # hash must be in the tagged tree: nix/release.json
  # (scripts/release-json.sh). It is committed, by github-actions[bot], as a
  # one-commit child of the released trunk commit, and only the tag v<V> is
  # pushed, pointing at that child; trunk never gets the commit. Agents and
  # a push loop commit to local trunk all the time, and a bot commit on
  # origin/trunk would make every local trunk diverge on every release; a
  # tag on no branch does not, and a tag push starts no run here. (Never
  # write the skip-CI marker, the words skip and ci in square brackets, in a
  # commit message, even to say it is not needed: GitHub starts no workflow
  # at all for a push whose head commit's message contains it anywhere.) So
  # the last release is the tag's parent, not an ancestor tag
  # (scripts/last-release.sh, which release-due and the notes ask).
  #
  # The derived version makes every build a unique, monotonic release, so
  # two pushes cannot collide on a tag. A re-run of a run keeps its run
  # number: re-running one whose release was already made fails at the
  # tag's push, which never moves a tag, or at gh release create, which
  # never overwrites a release.
  release:
    needs: [check, race, build, nix]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/trunk'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # To start CI on trunk's head, where this commit cannot be tagged.
      actions: write
    steps:
      # fetch-depth: 0 because the minor is the commit count, which
      # scripts/version.sh REFUSES to count in a shallow clone; fetch-tags so
      # the previous tags, and the commits they name off trunk, are here,
      # for release-due and the notes below.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      # For mise run release-due.
      - uses: jdx/mise-action@v5

      - uses: actions/download-artifact@v8
        with:
          name: binaries
          path: artifacts

      # Whether to release, and if so the assets, laid out and checked.
      #
      # GitHub refuses GITHUB_TOKEN, which can never hold the workflows
      # permission, a new ref whose .github/workflows differ from trunk's
      # head ("HTTP 403: Resource not accessible by integration"): a tag of
      # this commit, once trunk has moved on to a commit that changed a
      # workflow, would be one. Then the release is trunk head's to make, its
      # commits including this one's: its own run makes it, or, where it has
      # none (a push made with GITHUB_TOKEN, or one GitHub skipped), one
      # started here.
      - name: Decide, and lay out the assets
        id: due
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.release || false }}
        run: |
          if [ "$FORCE" != true ] && ! mise run release-due; then
            echo "Nothing a release is built from changed since the last release: no release."
            exit 0
          fi
          git fetch -q origin trunk
          head=$(git rev-parse FETCH_HEAD)
          if [ "$head" != "$GITHUB_SHA" ] && ! git diff --quiet "$GITHUB_SHA" "$head" -- .github/workflows; then
            echo "::warning::trunk is at ${head:0:7}, which changed a workflow since ${GITHUB_SHA:0:7}: GITHUB_TOKEN cannot tag ${GITHUB_SHA:0:7}, so the release is ${head:0:7}'s"
            if [ "$(gh run list --workflow ci.yml --commit "$head" --json databaseId --jq length)" = 0 ]; then
              gh workflow run ci.yml --ref trunk -f release="$FORCE"
            fi
            exit 0
          fi
          V="$(./scripts/version.sh)"
          scripts/release-assets.sh "$V" release artifacts
          echo "version=$V" >> "$GITHUB_OUTPUT"

      # Notes from the COMMITS since the last release, written before this
      # release's tag exists. Trunk-based means direct pushes and no pull
      # requests, so GitHub's PR-based --generate-notes would come out empty.
      # On the first release there is no prior tag, so fall back to the head
      # commit rather than dumping the whole history.
      - name: Release notes
        if: steps.due.outputs.version != ''
        env:
          V: ${{ steps.due.outputs.version }}
        run: |
          if read -r _ prev < <(scripts/last-release.sh); then
            git log "$prev..$GITHUB_SHA" --pretty='- %s (%h)' > notes.md
          else
            { echo 'First automated release.'; echo; git log -1 --pretty='- %s (%h)' "$GITHUB_SHA"; } > notes.md
          fi
          {
            echo
            echo "Static linux binaries for amd64 and arm64. To check what you downloaded: sha256sum --ignore-missing -c SHA256SUMS"
            echo "With Nix: inputs.quoin.url = \"github:danielbodart/quoin/v$V\";"
          } >> notes.md

      # The tag, on its own commit (see the top of this job): nix/release.json
      # for the binaries laid out above, committed on a detached HEAD whose
      # parent is the commit this run tested, and only the tag pushed.
      - name: Tag v<V> on a child commit holding nix/release.json
        if: steps.due.outputs.version != ''
        env:
          V: ${{ steps.due.outputs.version }}
        run: |
          git checkout -q --detach "$GITHUB_SHA"
          mkdir -p nix
          scripts/release-json.sh "$V" release/SHA256SUMS > nix/release.json
          cat nix/release.json
          git add nix/release.json
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Release v$V" \
              -m "nix/release.json, for flake.nix: the release's version and each binary's URL and hash. This commit is on no branch; only the tag v$V names it."
          git tag "v$V"
          git push -q origin "refs/tags/v$V"

      # The release, on the tag just pushed (--verify-tag: never one GitHub
      # would make itself, on trunk).
      - name: Create GitHub Release
        if: steps.due.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.due.outputs.version }}
        run: gh release create "v$V" --verify-tag --title "v$V" --notes-file notes.md release/*
