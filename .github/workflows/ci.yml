name: CI

on:
  push:
    branches: [trunk]
  pull_request:
  # A dispatch is checked as a push is, and released as a push is, if
  # RELEASE_PATHS (mise.toml) changed since the last release; `release`
  # releases regardless. The weekly update dispatches it with `release` when
  # mise run release-due says so, its push having started nothing.
  workflow_dispatch:
    inputs:
      release:
        type: boolean
        default: false

# A run shell is bash -eo pipefail: a failure inside a pipe fails the step.
defaults:
  run:
    shell: bash

jobs:
  # Lint and unit tests through mise, the dev loop's toolchain: minutes
  # before the Nix legs below, which build the same tests again and more.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      # As the Nix legs', so peer's namespace tests run rather than skip.
      - name: Let unprivileged user namespaces hold capabilities
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: mise run check

  # The checks spread over runners, each with its own four vCPUs: on one
  # runner the VM tests, the Zig check and the race tests all shared four, and
  # the whole check took seven minutes. Each check that takes minutes is a leg
  # of its own, named in SEPARATE; the rest leg builds every other check, so a
  # check added to the flake is built by the rest leg until it is given one,
  # and is never left out. Every leg builds the package itself: the legs run
  # at once, and the danielbodart cache, read here, only has quoin's packages
  # of a trunk commit built before (the rest leg pushes them), never this
  # commit's from another leg.
  nix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        checks: [signer, sudo-gate, sudo-remote, policy, sudo-zig, race, rest]
    env:
      # The legs above but rest: kept in step with them, which the rest leg
      # holds by counting.
      SEPARATE: signer sudo-gate sudo-remote policy sudo-zig race
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            system-features = nixos-test benchmark big-parallel kvm

      # The danielbodart cache, read-only here: the free tier is 5 GB, so
      # only quoin's own packages are pushed, by the last step, never a VM
      # test's closure.
      - uses: cachix/cachix-action@v17
        with:
          name: danielbodart
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true

      # nixos-test and kvm are declared for the VM tests: the signer over a
      # software TPM, the sudo gate, remote sudo and the courier. The standard
      # runner has KVM, and install-nix-action opens it to the build users,
      # but it has four vCPUs for every VM and build the check runs at once.
      #
      # peer's tests make a user namespace to see a process in one told apart
      # from the host's. The Nix build sandbox is itself a user namespace and
      # nesting works inside it, and where it does not, that test skips rather
      # than fails, so this check means less on such a machine but never lies.
      #
      # Ubuntu's runners are such a machine: AppArmor lets an unprivileged
      # user namespace be made and then refuses every capability in it. Lifted
      # here, so the namespace tests run rather than skip.
      - name: Let unprivileged user namespaces hold capabilities
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build ${{ matrix.checks }}
        env:
          LEG: ${{ matrix.checks }}
          LEGS: ${{ strategy.job-total }}
        run: |
          if [ "$LEG" = rest ]; then
            read -ra separate <<<"$SEPARATE"
            if [ "$LEGS" -ne $(( ${#separate[@]} + 1 )) ]; then
              echo "SEPARATE names ${#separate[@]} legs and the matrix has $LEGS with rest: keep them in step" >&2
              exit 1
            fi
            all=$(nix eval --json .#checks.x86_64-linux --apply builtins.attrNames | jq -r '.[]')
            for c in "${separate[@]}"; do
              grep -qxF "$c" <<<"$all" || { echo "SEPARATE names $c, which is no check" >&2; exit 1; }
            done
            mapfile -t checks < <(grep -vxF -f <(printf '%s\n' "${separate[@]}") <<<"$all")
            # And what nix flake check built besides the checks.
            extra=(.#devShells.x86_64-linux.default .#formatter.x86_64-linux)
          else
            checks=("$LEG")
            extra=()
          fi
          nix build --no-link --print-build-logs "${checks[@]/#/.#checks.x86_64-linux.}" "${extra[@]}"

      # The packages a host installs, from the rest leg, which builds them.
      - name: Push quoin's packages to Cachix
        if: matrix.checks == 'rest' && github.event_name != 'pull_request' && github.ref == 'refs/heads/trunk'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: nix build --no-link --print-out-paths .#quoin .#quoin-sudo-plugin | cachix push danielbodart

  # CONTINUOUS RELEASE. Trunk-based: every push to trunk that passes the
  # checks above and changed RELEASE_PATHS since the last release is
  # published, with no manual step and no tag to cut by hand. Gated on a push
  # or a dispatch on trunk (never a pull request), and on every check having
  # succeeded, so a red commit never ships. A release is a tag and its notes:
  # consumers take the flake and the Go module from it.
  #
  # The derived version (major.commit-count.run-number, scripts/version.sh)
  # makes every build a unique, monotonic release, so two pushes cannot collide
  # on a tag and a re-run of the same commit does not either.
  release:
    needs: [check, nix]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/trunk'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # To start CI on trunk's head, where this commit cannot be tagged.
      actions: write
    steps:
      # fetch-depth: 0 because the minor is the commit count, which
      # scripts/version.sh REFUSES to count in a shallow clone; fetch-tags so
      # the previous tag resolves, for release-due and the notes below.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      # For release-due, which reads RELEASE_PATHS from mise.toml.
      - uses: jdx/mise-action@v5

      # Notes from the COMMITS since the last release. Trunk-based means direct
      # pushes and no pull requests, so GitHub's PR-based --generate-notes
      # would come out empty. On the first release there is no prior tag, so
      # fall back to the head commit rather than dumping the whole history.
      #
      # GitHub refuses GITHUB_TOKEN, which can never hold the workflows
      # permission, a new ref whose .github/workflows differ from trunk's
      # head ("HTTP 403: Resource not accessible by integration"): a tag of
      # this commit, once trunk has moved on to a commit that changed a
      # workflow, would be one. Then the release is trunk head's to make, its
      # commits including this one's: its own run makes it, or, where it has
      # none (a [skip ci] push, a push made with GITHUB_TOKEN), one started
      # here.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.release || false }}
        run: |
          if [ "$FORCE" != true ] && ! mise run release-due; then
            echo "Nothing in RELEASE_PATHS changed since the last release: no release."
            exit 0
          fi
          git fetch -q origin trunk
          head=$(git rev-parse FETCH_HEAD)
          if [ "$head" != "$GITHUB_SHA" ] && ! git diff --quiet "$GITHUB_SHA" "$head" -- .github/workflows; then
            echo "::warning::trunk is at ${head:0:7}, which changed a workflow since ${GITHUB_SHA:0:7}: GITHUB_TOKEN cannot tag ${GITHUB_SHA:0:7}, so the release is ${head:0:7}'s"
            if [ "$(gh run list --workflow ci.yml --commit "$head" --json databaseId --jq length)" = 0 ]; then
              gh workflow run ci.yml --ref trunk -f release="$FORCE"
            fi
            exit 0
          fi
          V="$(./scripts/version.sh)"
          PREV="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)"
          if [ -n "$PREV" ]; then
            git log "$PREV..HEAD" --pretty='- %s (%h)' > notes.md
          else
            { echo 'First automated release.'; echo; git log -1 --pretty='- %s (%h)'; } > notes.md
          fi
          gh release create "v$V" --title "v$V" --notes-file notes.md --target "$GITHUB_SHA"
