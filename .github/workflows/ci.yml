name: CI

on:
  push:
    branches: [trunk]
  pull_request:
  workflow_dispatch:

jobs:
  # The checks spread over runners, each with its own four vCPUs: on one
  # runner the VM tests, the Zig check and the race tests all shared four, and
  # the whole check took seven minutes. Each check that takes minutes is a leg
  # of its own, named in SEPARATE; the rest leg builds every other check, so a
  # check added to the flake is built by the rest leg until it is given one,
  # and is never left out. Every leg builds the package itself, there being no
  # binary cache to share it through.
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        checks: [signer, sudo-gate, sudo-remote, policy, sudo-zig, race, rest]
    env:
      # The legs above but rest: kept in step with them, which the rest leg
      # holds by counting.
      SEPARATE: signer sudo-gate sudo-remote policy sudo-zig race
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            system-features = nixos-test benchmark big-parallel kvm

      # No binary cache. The free tier of the Magic Nix Cache was shut down in
      # February 2025, when GitHub retired the cache API it was built on, and
      # it now answers 400. FlakeHub Cache or Cachix are the options if the
      # check grows too slow without one.
      #
      # nixos-test and kvm are declared for the VM tests: the signer over a
      # software TPM, the sudo gate, remote sudo and the courier. The standard
      # runner has KVM, and install-nix-action opens it to the build users,
      # but it has four vCPUs for every VM and build the check runs at once.
      #
      # peer's tests make a user namespace to see a process in one told apart
      # from the host's. The Nix build sandbox is itself a user namespace and
      # nesting works inside it, and where it does not, that test skips rather
      # than fails, so this check means less on such a machine but never lies.
      #
      # Ubuntu's runners are such a machine: AppArmor lets an unprivileged
      # user namespace be made and then refuses every capability in it. Lifted
      # here, so the namespace tests run rather than skip.
      - name: Let unprivileged user namespaces hold capabilities
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # nix flake check --no-build evaluates every output, on every system,
      # as nix flake check would, and builds nothing: the legs build.
      - name: Evaluate the flake
        if: matrix.checks == 'rest'
        run: nix flake check --no-build

      - name: Build ${{ matrix.checks }}
        env:
          LEG: ${{ matrix.checks }}
          LEGS: ${{ strategy.job-total }}
        run: |
          if [ "$LEG" = rest ]; then
            read -ra separate <<<"$SEPARATE"
            if [ "$LEGS" -ne $(( ${#separate[@]} + 1 )) ]; then
              echo "SEPARATE names ${#separate[@]} legs and the matrix has $LEGS with rest: keep them in step" >&2
              exit 1
            fi
            all=$(nix eval --json .#checks.x86_64-linux --apply builtins.attrNames | jq -r '.[]')
            for c in "${separate[@]}"; do
              grep -qxF "$c" <<<"$all" || { echo "SEPARATE names $c, which is no check" >&2; exit 1; }
            done
            mapfile -t checks < <(grep -vxF -f <(printf '%s\n' "${separate[@]}") <<<"$all")
          else
            checks=("$LEG")
          fi
          nix build --no-link --print-build-logs "${checks[@]/#/.#checks.x86_64-linux.}"

  # CONTINUOUS RELEASE. Trunk-based: every push to trunk that passes the check
  # above is published, with no manual step and no tag to cut by hand. Gated on
  # a direct push to trunk (never a pull request) and on the check having
  # succeeded, so a red commit never ships.
  #
  # The derived version (major.commit-count.run-number, scripts/version.sh)
  # makes every build a unique, monotonic release, so two pushes cannot collide
  # on a tag and a re-run of the same commit does not either.
  release:
    needs: [check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/trunk' && needs.check.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # fetch-depth: 0 because the minor is the commit count and the script
      # REFUSES a shallow clone; fetch-tags so the previous tag resolves when
      # the notes are generated below.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      # Notes from the COMMITS since the last release. Trunk-based means direct
      # pushes and no pull requests, so GitHub's PR-based --generate-notes
      # would come out empty. On the first release there is no prior tag, so
      # fall back to the head commit rather than dumping the whole history.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$(./scripts/version.sh)"
          PREV="$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)"
          if [ -n "$PREV" ] && git rev-parse -q --verify "refs/tags/$PREV" >/dev/null; then
            git log "$PREV..HEAD" --pretty='- %s (%h)' > notes.md
          else
            { echo 'First automated release.'; echo; git log -1 --pretty='- %s (%h)'; } > notes.md
          fi
          gh release create "v$V" --title "v$V" --notes-file notes.md --target "$GITHUB_SHA"
