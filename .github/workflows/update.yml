# The weekly update: every dependency of every kind moves, in one window
# every danielbodart repo shares, Sunday 21:23 UTC. nix-config takes its own
# at 23:23 on the same nixos-26.05, so the Zig plugin's Nix build here is
# the derivation nix-config then builds, already in the danielbodart cache.
# quoin's Go binaries are a release's, pinned by tag (flake.nix), so nothing
# here is built for them.
#
# What moves, in order: every flake input (nix flake update); galley, the Go
# module of mine this one requires, to its latest release tag
# (scripts/pin.sh), a tag only existing for a commit its CI passed; each
# mise.toml tool to the latest patch of its pinned minor (a new minor moves
# by hand, with the nixpkgs attribute the dev shell offers); every Go
# dependency (go get -u); and
# sudo/build.zig.zon's minish and zwanzig to their latest release tags, with
# nix/sudo-zig.nix's zigDeps hash (scripts/zig-deps.sh).
#
# The gate is everything CI runs, on this one runner rather than CI's legs:
# slower, but nobody is waiting on it. Only if it passes is anything
# committed, straight to trunk, never as a pull request.
#
# A push made with GITHUB_TOKEN starts no workflow, so the last step
# dispatches CI on trunk with `release`, which checks the commit and releases
# it -- but only if scripts/release-due.sh says something a release is
# built from changed since the last release. The binaries are built by
# mise's Go, so a week that moved Go's patch (often a crypto or net security
# fix) releases; one in which only flake.lock moved releases nothing: a
# consumer follows its own nixpkgs, and the release would be the same code
# under a new version.
name: Weekly update

on:
  schedule:
    - cron: "23 21 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# Shared with anything else that commits to trunk.
concurrency:
  group: update

# A run shell is bash -eo pipefail: a failure inside a pipe fails the step.
defaults:
  run:
    shell: bash

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      # The Go mise.toml pins, never one go.mod's toolchain line downloads.
      GOTOOLCHAIN: local
    steps:
      # The whole history and its tags, for mise run release-due.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            system-features = nixos-test benchmark big-parallel kvm

      # Read-only: only the plugin is pushed, by a later step.
      - uses: cachix/cachix-action@v17
        with:
          name: danielbodart
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true

      - uses: jdx/mise-action@v5

      - name: Move everything
        id: update
        run: |
          moved=()
          gomods() { go mod edit -json | jq -r '.Require[] | "\(.Path) \(.Version)"' | sort; }
          # The tag go.mod requires, or else the one flake.nix's url names.
          ownver() {
            go mod edit -json | jq -r --arg m "github.com/danielbodart/$1" '.Require[] | select(.Path == $m) | .Version' | grep . ||
              sed -n "s|.*url = \"github:danielbodart/$1/\(v[^\"]*\)\";.*|\1|p" flake.nix
          }

          # 1. The flake's inputs, then my own repos to their latest tags.
          nix flake update 2>&1 | tee update.log
          mapfile -t inputs < <(grep -oE "Updated input '[^']+'" update.log | cut -d"'" -f2)
          moved+=("${inputs[@]}")
          before=$(gomods)
          for name in galley; do
            was=$(ownver "$name")
            scripts/pin.sh "$name"
            now=$(ownver "$name")
            if [ "$was" != "$now" ]; then moved+=("$name $was -> $now"); fi
          done

          # 2. mise's tools, each to the latest patch of its pinned
          # major.minor (go 1.27.3 asks for 1.27, coreutils 9.12 for 9.12).
          while read -r tool was; do
            now=$(mise latest "$tool@$(cut -d. -f1-2 <<<"$was")")
            if [ -n "$now" ] && [ "$now" != "$was" ]; then
              sed -i -E "s|^(\"?$tool\"? = )\"$was\"|\1\"$now\"|" mise.toml
              moved+=("$tool $was -> $now")
            fi
          done < <(sed -n -E '/^\[tools\]/,/^\[/s/^"?([a-z0-9_:-]+)"? = "([0-9.]+)"$/\1 \2/p' mise.toml)
          mise install

          # 3. Every Go dependency.
          go get -u ./...
          go mod tidy
          mapfile -t mods < <(comm -13 <(echo "$before") <(gomods) | cut -d' ' -f1 | grep -v '^github.com/danielbodart/' || true)
          moved+=("${mods[@]}")

          # 3b. The Zig plugin's dependencies, and the zigDeps hash they make.
          zigs=$(scripts/zig-deps.sh)
          mapfile -t zigs <<<"$zigs"
          moved+=("${zigs[@]}")

          # 4.
          if git diff --quiet; then
            echo "Nothing moved."
            exit 0
          fi
          list=$(printf '%s\n' "${moved[@]}" | { grep . || true; } | paste -sd, - | sed 's/,/, /g')
          echo "moved=${list:-dependencies}" >> "$GITHUB_OUTPUT"

      # 5. The gate: what CI runs, mise's check and race, and every Nix
      # check. As CI's: swtpm, the REQUIRE variables, and the namespace
      # tests running rather than skipping.
      - name: swtpm, for the TPM tests
        if: steps.update.outputs.moved
        run: sudo apt-get install -y --no-install-recommends swtpm

      - name: Let unprivileged user namespaces hold capabilities
        if: steps.update.outputs.moved
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: mise run check
        if: steps.update.outputs.moved
        env:
          QUOIN_REQUIRE_SWTPM: "1"
          QUOIN_REQUIRE_SSH_KEYGEN: "1"
        run: mise run check

      - name: mise run race
        if: steps.update.outputs.moved
        env:
          QUOIN_REQUIRE_SWTPM: "1"
          QUOIN_REQUIRE_SSH_KEYGEN: "1"
        run: mise run race

      # As CI's nix job: the binaries, built as the build job builds them,
      # made the flake's release (scripts/nix-local-release.sh, which
      # stages a nix/release.json that the commit below must not take),
      # then every check, the packages, the dev shell and the formatter.
      - name: Build what CI builds
        if: steps.update.outputs.moved
        run: |
          mise run build
          V="$(scripts/version.sh)"
          scripts/release-assets.sh "$V" "$RUNNER_TEMP/release" dist
          scripts/nix-local-release.sh "$V" "$RUNNER_TEMP/release"
          mapfile -t checks < <(nix eval --json .#checks.x86_64-linux --apply builtins.attrNames | jq -r '.[]')
          nix build --no-link --print-build-logs "${checks[@]/#/.#checks.x86_64-linux.}" \
            .#packages.x86_64-linux.quoin .#packages.x86_64-linux.fakegalley .#packages.x86_64-linux.agenttamper \
            .#devShells.x86_64-linux.default .#formatter.x86_64-linux
          scripts/nix-eval-systems.sh
          git rm -q --cached nix/release.json
          rm -rf nix/release.json dist

      # 6.
      - name: Commit and push
        if: steps.update.outputs.moved
        env:
          MOVED: ${{ steps.update.outputs.moved }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "Weekly update: $MOVED"
          git pull -q --rebase origin trunk
          git push -q origin HEAD:trunk

      # 7.
      - name: Push the plugin to Cachix
        if: steps.update.outputs.moved
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: nix build --no-link --print-out-paths .#quoin-sudo-plugin | cachix push danielbodart

      # 8. A release, if anything it is built from moved (Go's pin among
      # them): CI checks the pushed commit and releases it. A week that moved
      # only flake.lock releases nothing.
      - name: Release, if anything it is built from moved
        if: steps.update.outputs.moved
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if mise run release-due; then gh workflow run ci.yml --ref trunk -f release=true; fi
